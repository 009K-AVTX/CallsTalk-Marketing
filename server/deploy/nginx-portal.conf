# /etc/nginx/sites-available/portal.callstalk.com
# The customer portal: the built portal (npm run portal:build -> portal/dist) and its API on the
# CallsTalk Node process. Run certbot after enabling it to add HTTPS (see docs/maintenance.md).
#
# This is the first line against floods: requests and connections per address are limited here, before they
# reach Node, and slow clients are cut off. The Node process limits again (server/src/rate-limit.js). A flood
# bigger than this server's connection can only be stopped in front of it (a CDN or the host's DDoS filter).

# Per visitor address. Site files are included inside nginx's http block, where these must be.
# The zone names start with ct_portal_ so they cannot clash with other sites on this server.
limit_req_zone  $binary_remote_addr zone=ct_portal_api:10m  rate=10r/s;
limit_req_zone  $binary_remote_addr zone=ct_portal_auth:10m rate=12r/m;
limit_req_zone  $binary_remote_addr zone=ct_portal_page:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=ct_portal_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name portal.callstalk.com;

    root /var/www/Callstalk/portal/dist;
    index index.html;
    server_tokens off;

    # Slow or half-open connections are dropped quickly instead of holding a worker.
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 15s;
    large_client_header_buffers 4 8k;
    limit_conn ct_portal_conn 30;
    limit_conn_status 429;
    limit_req_status 429;

    # Requests are small; only report uploads (an Excel file up to 3 MB, sent as base64) are allowed more.
    client_max_body_size 1m;

    # Every reply. Locations that set their own headers repeat these (nginx does not inherit add_header).
    #  - The page may only run our own scripts and talk to our own API (Content-Security-Policy), cannot be
    #    framed, and sends no Referer (setup links carry a one-use token).
    #  - HSTS: browsers keep to HTTPS once they have seen it (sent over HTTPS only).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # API: 10 requests a second per address with bursts of 60 (a page opens several at once).
    location /api/ {
        limit_req zone=ct_portal_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 70s;
    }

    # Signing in, codes, setup links and session renewal: 12 a minute per address, short bursts only.
    location ~ ^/api/accounts/(login|verify-mfa|invite|refresh) {
        limit_req zone=ct_portal_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /api/staff/reports {
        limit_req zone=ct_portal_api burst=20 nodelay;
        client_max_body_size 6m;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 70s;
    }

    location /assets/ {
        limit_req zone=ct_portal_page burst=100 nodelay;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    # Source maps are never published; refuse them outright in case a build ever makes one.
    location ~ \.map$ {
        return 404;
    }

    # A single-page app: /login, /setup, /admin ... all load index.html.
    location / {
        limit_req zone=ct_portal_page burst=40 nodelay;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri /index.html;
    }
}
