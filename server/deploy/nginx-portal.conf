# /etc/nginx/sites-available/portal.callstalk.com
# The customer portal: the built portal (npm run portal:build -> portal/dist) and its API on the
# CallsTalk Node process. Run certbot after enabling it to add HTTPS (see docs/maintenance.md).

server {
    listen 80;
    listen [::]:80;
    server_name portal.callstalk.com;

    root /var/www/Callstalk/portal/dist;
    index index.html;

    # Report uploads are Excel files up to 3 MB, sent as base64.
    client_max_body_size 5m;

    # Locations that set their own headers repeat these (nginx does not inherit add_header).
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        try_files $uri =404;
    }

    # A single-page app: /login, /setup, /admin ... all load index.html.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        try_files $uri /index.html;
    }
}
