# /etc/nginx/sites-available/callstalk-chat
# Replace chat.callstalk.com with your domain, then run certbot (see server/README.md) to add HTTPS.
#
# The website's chat reaches the same Node process as the portal, so it is limited here first, per visitor
# address (see nginx-portal.conf for the reasoning). Zone names start with ct_chat_ to stay apart from other sites.

limit_req_zone  $binary_remote_addr zone=ct_chat_req:10m  rate=5r/s;
limit_conn_zone $binary_remote_addr zone=ct_chat_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name chat.callstalk.com;
    server_tokens off;

    client_max_body_size 64k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 15s;
    limit_conn ct_chat_conn 20;
    limit_conn_status 429;
    limit_req_status 429;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        limit_req zone=ct_chat_req burst=30 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
